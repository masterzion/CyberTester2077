<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Child UI audit — {{RUN_ID}}</title><style>
:root{--ink:#10243e;--muted:#68778b;--bg:#f4f7fb;--card:#fff;--line:#dce5ef;--good:#08785b;--warn:#a95c00;--bad:#bd3035;--accent:#6256e8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,Segoe UI,Arial,sans-serif}.wrap{max-width:1320px;margin:auto;padding:30px}.hero{background:linear-gradient(135deg,#172e50,#6256e8);color:#fff;border-radius:24px;padding:34px;box-shadow:0 14px 36px #172a4b28}.eyebrow,.label{letter-spacing:.12em;text-transform:uppercase;font-size:11px}.hero h1{margin:6px 0;font-size:32px}.hero p{margin:0;opacity:.85}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:20px 0}.card,.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:19px;box-shadow:0 4px 16px #1a31530a}.metric{font-size:29px;font-weight:750}.label{color:var(--muted)}.panel{margin:18px 0}.panel h2{margin:0 0 12px;font-size:18px}.model{border-left:4px solid var(--accent);padding-left:16px}.issue{border-left:4px solid var(--bad);background:#fff7f7;border-radius:10px;padding:12px;margin:9px 0}.issue.warn{border-left-color:var(--warn);background:#fffaf2}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.toolbar input,.toolbar select{border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:#fff}table{width:100%;border-collapse:collapse;margin-top:14px}th,td{text-align:left;padding:11px;border-top:1px solid var(--line);vertical-align:top}th{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}.pill{display:inline-block;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:700}.PASS{background:#daf5eb;color:var(--good)}.FAIL{background:#fde3e3;color:var(--bad)}.WARN,.SKIP{background:#fff0d5;color:var(--warn)}.thumb{width:110px;height:70px;object-fit:cover;border:1px solid var(--line);border-radius:8px;display:block}.muted{color:var(--muted)}details{border-top:1px solid var(--line);padding:10px 0}summary{cursor:pointer;font-weight:650}pre{white-space:pre-wrap;word-break:break-word;background:#f5f7fa;padding:12px;border-radius:10px;font-size:12px}@media(max-width:850px){.wrap{padding:14px}.grid{grid-template-columns:repeat(2,1fr)}table{font-size:13px}.thumb{width:76px;height:52px}}
</style></head><body><main class="wrap"><section class="hero"><div class="eyebrow">LLM-guided exploratory QA</div><h1>Child interface audit</h1><p>Run {{RUN_ID}} · generated {{GENERATED_AT}}</p></section><section class="grid" id="metrics"></section><section class="panel"><h2>Test engineer narrative & design recommendations</h2><div class="model">{{MODEL_HTML}}</div></section><section class="panel"><h2>Issues requiring attention</h2><div id="issues"></div></section><section class="panel"><h2>Interaction evidence</h2><div class="toolbar"><input id="search" placeholder="Search component, result, or issue"><select id="status"><option value="">All outcomes</option><option>PASS</option><option>FAIL</option><option>WARN</option><option>SKIP</option></select><span class="muted" id="shown"></span></div><table><thead><tr><th>Outcome</th><th>Component</th><th>What happened</th><th>Evidence</th></tr></thead><tbody id="rows"></tbody></table></section><section class="panel"><h2>Raw model observations</h2><div id="models"></div></section></main><script>const summary={{SUMMARY_JSON}},rows={{ROWS_JSON}},models={{MODELS_JSON}};const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));for(const [label,value]of Object.entries(summary))document.querySelector('#metrics').innerHTML+='<div class="card"><div class="metric">'+value+'</div><div class="label">'+label+'</div></div>';const issues=rows.filter(x=>x.status==='FAIL'||x.status==='WARN');document.querySelector('#issues').innerHTML=issues.length?issues.map(x=>'<article class="issue '+(x.status==='WARN'?'warn':'')+'"><strong>'+esc(x.component)+'</strong><br>'+esc(x.detail)+'<br><span class="muted">Why this matters: the expected interaction or system response was not confirmed.</span></article>').join(''):'<p class="muted">No failures or warnings were recorded.</p>';function render(){const q=document.querySelector('#search').value.toLowerCase(),state=document.querySelector('#status').value;const filtered=rows.filter(x=>(!state||x.status===state)&&JSON.stringify(x).toLowerCase().includes(q));document.querySelector('#shown').textContent=filtered.length+' shown';document.querySelector('#rows').innerHTML=filtered.map(x=>'<tr><td><span class="pill '+esc(x.status)+'">'+esc(x.status)+'</span></td><td>'+esc(x.component)+'</td><td>'+esc(x.detail)+'</td><td>'+(x.screenshot?'<a href="'+encodeURI(x.screenshot)+'" target="_blank" title="Open full screenshot"><img class="thumb" src="'+encodeURI(x.screenshot)+'" alt="Screenshot for '+esc(x.component)+'"></a>':'<span class="muted">No screenshot</span>')+'</td></tr>').join('')}document.querySelector('#search').oninput=render;document.querySelector('#status').onchange=render;document.querySelector('#models').innerHTML=models.map(m=>'<details><summary>'+esc(m.url)+' · screenshot accepted: '+esc(m.screenshotAccepted)+'</summary><pre>'+esc(m.rawResponse)+'</pre></details>').join('');render();</script></body></html>
